<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>بوابة الإدارة | مفقودين الجزائر</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css?v=global-rtl-ads-6">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
</head>
<body class="bg-light">
  <main class="min-vh-100 d-flex align-items-center justify-content-center p-4">
    <section class="report-form-card text-center" style="max-width: 560px; width: 100%;">
      <span class="brand-icon mx-auto mb-4" style="width:64px;height:64px;font-size:1.6rem;background:var(--green-700);color:#fff"><i class="fas fa-shield-halved"></i></span>
      <h1 class="h3 mb-3">بوابة الإدارة الآمنة</h1>
      <p class="text-muted mb-4">لوحة المراجعة محمية بتسجيل دخول المشرف. لا تعرض هذه الصفحة أي بيانات بلاغات أو بيانات اتصال.</p>
      <a id="adminDashboardLink" class="btn btn-success px-4 disabled" aria-disabled="true"><i class="fas fa-lock me-2"></i>فتح لوحة الإدارة</a>
      <p id="adminSetupHint" class="small text-muted mt-3 mb-0">يجري إعداد رابط لوحة الإدارة.</p>
      <p class="mt-4 mb-0"><a href="../index.html" class="text-decoration-none"><i class="fas fa-arrow-right me-1"></i>العودة إلى الموقع العام</a></p>
    </section>
  </main>
  <script src="../js/api-config.js"></script>
  <script>
    const baseUrl = String(window.MAFKOUDIN_REPORTS_API_BASE_URL || "").replace(/\/$/, "");
    const link = document.getElementById("adminDashboardLink");
    const hint = document.getElementById("adminSetupHint");
    if (baseUrl) {
      link.href = baseUrl;
      link.classList.remove("disabled");
      link.setAttribute("aria-disabled", "false");
      hint.textContent = "سيُطلب منك تسجيل الدخول بحساب المشرف للوصول إلى لوحة المراجعة.";
    }
  </script>
</body>
</html>
